server:
  port: ${SERVER_PORT:5001}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

spring:
  datasource:
    url: ${DB_URL:jdbc:h2:file:./data/hacksim;AUTO_SERVER=TRUE}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

vmware:
  run-path: ${VMWARE_RUN_PATH:/Applications/VMware Fusion.app/Contents/Library/vmrun}
  snapshot:
    name: ${VMWARE_SNAPSHOT_NAME:clean}
    revert-before-run: ${VMWARE_REVERT_BEFORE_RUN:true}
  guest:
    vmx-path: ${VMWARE_GUEST_VMX_PATH:/Users/jaeuahn/Virtual Machines.localized/capstone.vmwarevm/capstone.vmx}
    username: ${VMWARE_GUEST_USERNAME:ahn jae-u}
    password: ${VMWARE_GUEST_PASSWORD:}

simulation:
  startup-delay-ms: ${SIMULATION_STARTUP_DELAY_MS:5000}
  shortcuts:
    ransomware: '${SIMULATION_RANSOMWARE_SHORTCUT:C:\Users\ahn jae-u\Desktop\Ransomware.lnk}'
    worm: '${SIMULATION_WORM_SHORTCUT:C:\Users\ahn jae-u\Desktop\Worm.lnk}'
    spyware: '${SIMULATION_SPYWARE_SHORTCUT:C:\Users\ahn jae-u\Desktop\Spyware.lnk}'
    trojan: '${SIMULATION_TROJAN_SHORTCUT:C:\Users\ahn jae-u\Desktop\Trojan.lnk}'
