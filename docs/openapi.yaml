openapi: 3.1.0
info:
  title: Hacksim API
  version: 0.0.1
  description: >
    Backend for the Hacksim malware-detonation sandbox: triggers detonations, ingests guest
    telemetry, returns ATT&CK-mapped behavioural reports, and stores endpoint posture self-assessments.
servers:
  - url: http://localhost:5001
    description: Local development

paths:
  /api/start-simulation/{simulationType}:
    post:
      summary: Trigger a detonation (async)
      description: >
        Accepts the request, records a run, and detonates on a background worker. Requires an API key.
      security:
        - ApiKeyAuth: []
      parameters:
        - name: simulationType
          in: path
          required: true
          schema: { type: string, enum: [ransomware, worm, spyware, trojan] }
      responses:
        '202':
          description: Detonation accepted; runs in background
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DetonationAccepted' }
        '401':
          description: Missing or invalid API key
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponse' }
        '404':
          description: Unknown simulation type
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponse' }

  /api/runs:
    get:
      summary: Recent detonation runs (audit log)
      responses:
        '200':
          description: Up to 50 most recent runs
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/DetonationRun' }

  /api/runs/{runId}:
    get:
      summary: Single run status (for polling)
      parameters:
        - { name: runId, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        '200':
          description: The run
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DetonationRun' }
        '404': { description: Run not found }

  /api/runs/{runId}/telemetry:
    post:
      summary: Ingest guest telemetry for a run
      description: Posted by the guest agent; the backend classifies each event to MITRE ATT&CK.
      parameters:
        - { name: runId, in: path, required: true, schema: { type: integer, format: int64 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items: { $ref: '#/components/schemas/TelemetryEventRequest' }
      responses:
        '200':
          description: Ingested
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponse' }
        '404': { description: Run not found }

  /api/runs/{runId}/report:
    get:
      summary: Behavioural analysis report for a run
      parameters:
        - { name: runId, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        '200':
          description: Report with ATT&CK techniques, IOCs, and the event timeline
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DetonationReport' }
        '404': { description: Run not found }

  /api/posture:
    post:
      summary: Submit an endpoint posture self-assessment
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PostureReportRequest' }
      responses:
        '200':
          description: Stored report with server-computed score
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PostureReportResponse' }
    get:
      summary: Recent posture reports
      responses:
        '200':
          description: Up to 20 most recent reports
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/PostureReportResponse' }

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key

  schemas:
    ApiResponse:
      type: object
      properties:
        status: { type: string, enum: [success, error] }
        message: { type: string }
    DetonationAccepted:
      type: object
      properties:
        status: { type: string, example: success }
        message: { type: string }
        runId: { type: integer, format: int64 }
    DetonationRun:
      type: object
      properties:
        id: { type: integer, format: int64 }
        scenarioId: { type: string }
        status: { type: string, enum: [REQUESTED, TRIGGERED, FAILED] }
        clientIp: { type: string }
        message: { type: string, nullable: true }
        requestedAt: { type: string, format: date-time }
        completedAt: { type: string, format: date-time, nullable: true }
    TelemetryEventRequest:
      type: object
      properties:
        eventType: { type: string, enum: [PROCESS_CREATE, NETWORK_CONNECT, FILE_WRITE, FILE_RENAME, REGISTRY_SET, DNS_QUERY, OTHER] }
        occurredAt: { type: string, format: date-time }
        actor: { type: string }
        target: { type: string }
        detail: { type: string, nullable: true }
    DetonationReport:
      type: object
      properties:
        runId: { type: integer, format: int64 }
        scenarioId: { type: string }
        status: { type: string }
        eventCount: { type: integer }
        attackTechniques:
          type: array
          items:
            type: object
            properties:
              id: { type: string, example: T1486 }
              name: { type: string }
              count: { type: integer }
        iocs:
          type: object
          properties:
            hosts: { type: array, items: { type: string } }
            files: { type: array, items: { type: string } }
            registryKeys: { type: array, items: { type: string } }
        events:
          type: array
          items:
            type: object
            properties:
              eventType: { type: string }
              occurredAt: { type: string, format: date-time }
              actor: { type: string }
              target: { type: string }
              detail: { type: string, nullable: true }
              attackTechniqueId: { type: string, nullable: true }
              attackTechniqueName: { type: string, nullable: true }
    PostureCheck:
      type: object
      properties:
        checkId: { type: string }
        name: { type: string }
        status: { type: string, enum: [PASS, WARN, FAIL] }
        severity: { type: string, enum: [LOW, MEDIUM, HIGH] }
        detail: { type: string }
    PostureReportRequest:
      type: object
      properties:
        hostId: { type: string }
        os: { type: string }
        checks:
          type: array
          items: { $ref: '#/components/schemas/PostureCheck' }
    PostureReportResponse:
      type: object
      properties:
        id: { type: integer, format: int64 }
        hostId: { type: string }
        os: { type: string }
        score: { type: integer }
        reportedAt: { type: string, format: date-time }
        checks:
          type: array
          items: { $ref: '#/components/schemas/PostureCheck' }
