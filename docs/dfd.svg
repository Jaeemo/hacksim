<svg width="680" viewBox="0 0 680 430" xmlns="http://www.w3.org/2000/svg" role="img" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>Hacksim data-flow diagram with trust boundaries</title>
  <desc>Level-1 DFD showing the client, server-host, and isolated-detonation zones, the data flows between them, and the trust boundaries B1 (browser/backend) and B2 (host/guest) that each crossing represents.</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#6b7280" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="680" height="430" rx="12" fill="#ffffff"/>
  <text x="20" y="28" font-size="15" font-weight="600" fill="#1f2937">Hacksim — data-flow diagram (trust boundaries)</text>

  <!-- trust boundaries -->
  <line x1="232" y1="48" x2="232" y2="408" stroke="#d85a30" stroke-width="1.5" stroke-dasharray="6 4"/>
  <line x1="470" y1="48" x2="470" y2="408" stroke="#d85a30" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="232" y="60" font-size="11" fill="#993c1d" text-anchor="middle">B1: network / CORS</text>
  <text x="470" y="60" font-size="11" fill="#993c1d" text-anchor="middle">B2: host / guest isolation</text>

  <!-- zone labels -->
  <text x="126" y="80" font-size="12" font-weight="600" fill="#5f5e5a" text-anchor="middle">Client (untrusted)</text>
  <text x="350" y="80" font-size="12" font-weight="600" fill="#5f5e5a" text-anchor="middle">Server host</text>
  <text x="575" y="80" font-size="12" font-weight="600" fill="#5f5e5a" text-anchor="middle">Isolated detonation env</text>

  <!-- external entity: User -->
  <rect x="66" y="96" width="120" height="38" fill="#f1efe8" stroke="#5f5e5a" stroke-width="1"/>
  <text x="126" y="119" font-size="13" fill="#2c2c2a" text-anchor="middle">User (browser)</text>

  <!-- process: Web UI -->
  <rect x="51" y="196" width="150" height="44" rx="10" fill="#e6f1fb" stroke="#185fa5" stroke-width="1"/>
  <text x="126" y="223" font-size="13" fill="#0c447c" text-anchor="middle">Web UI (React)</text>

  <!-- process: Backend API -->
  <rect x="265" y="96" width="170" height="46" rx="10" fill="#e6f1fb" stroke="#185fa5" stroke-width="1"/>
  <text x="350" y="124" font-size="13" fill="#0c447c" text-anchor="middle">Backend API (Spring)</text>

  <!-- process: vmrun -->
  <rect x="248" y="206" width="112" height="44" rx="10" fill="#e6f1fb" stroke="#185fa5" stroke-width="1"/>
  <text x="304" y="233" font-size="13" fill="#0c447c" text-anchor="middle">vmrun / host</text>

  <!-- data store: Audit DB -->
  <rect x="378" y="206" width="122" height="48" rx="4" fill="#e1f5ee" stroke="#0f6e56" stroke-width="1"/>
  <line x1="378" y1="218" x2="500" y2="218" stroke="#0f6e56" stroke-width="1"/>
  <text x="439" y="234" font-size="12" fill="#04342c" text-anchor="middle">Audit DB</text>
  <text x="439" y="248" font-size="11" fill="#0f6e56" text-anchor="middle">runs + telemetry</text>

  <!-- process: Detonation VM -->
  <rect x="500" y="118" width="150" height="46" rx="10" fill="#fbe9e2" stroke="#993c1d" stroke-width="1"/>
  <text x="575" y="146" font-size="13" fill="#712b13" text-anchor="middle">Detonation VM</text>

  <!-- external entity: Fake internet -->
  <rect x="505" y="244" width="140" height="42" fill="#f1efe8" stroke="#5f5e5a" stroke-width="1"/>
  <text x="575" y="262" font-size="12" fill="#2c2c2a" text-anchor="middle">Fake internet</text>
  <text x="575" y="277" font-size="11" fill="#5f5e5a" text-anchor="middle">(INetSim)</text>

  <!-- flows -->
  <line x1="126" y1="134" x2="126" y2="194" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr)"/>

  <line x1="201" y1="210" x2="263" y2="132" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="232" y="168" font-size="11" fill="#374151" text-anchor="middle">detonate / report</text>

  <line x1="338" y1="142" x2="312" y2="204" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="372" y1="142" x2="420" y2="204" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="455" y="180" font-size="11" fill="#374151" text-anchor="middle">persist</text>

  <line x1="362" y1="224" x2="498" y2="150" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="430" y="196" font-size="11" fill="#374151" text-anchor="middle">revert + run</text>

  <line x1="540" y1="164" x2="437" y2="144" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="505" y="108" font-size="11" fill="#374151" text-anchor="middle">Sysmon telemetry</text>

  <line x1="575" y1="164" x2="575" y2="242" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="588" y="208" font-size="11" fill="#374151" text-anchor="start">C2 / DNS (contained)</text>

  <!-- noVNC stream: guest screen back to the browser, routed along the bottom -->
  <polyline points="560,164 560,392 126,392 126,242" fill="none" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="2 3" marker-end="url(#arr)"/>
  <text x="340" y="386" font-size="11" fill="#374151" text-anchor="middle">noVNC stream (guest screen)</text>

  <!-- legend -->
  <rect x="20" y="404" width="14" height="11" fill="#f1efe8" stroke="#5f5e5a"/>
  <text x="40" y="414" font-size="11" fill="#374151">external entity</text>
  <rect x="150" y="404" width="14" height="11" rx="3" fill="#e6f1fb" stroke="#185fa5"/>
  <text x="170" y="414" font-size="11" fill="#374151">process</text>
  <rect x="250" y="404" width="14" height="11" fill="#e1f5ee" stroke="#0f6e56"/>
  <text x="270" y="414" font-size="11" fill="#374151">data store</text>
</svg>
