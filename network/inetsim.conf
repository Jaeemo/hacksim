#
# INetSim configuration for the Hacksim detonation sink.
#
# Emulates common internet services on the isolated vmnet so malware C2/DNS/download behaviour is
# observed and answered locally, with no real egress. Set the two *_address / *_ip values below to
# the fake-net VM's address on the host-only network.
#

# Services to emulate (add/remove as needed)
start_service dns
start_service http
start_service https
start_service smtp
start_service smtps
start_service pop3
start_service ftp

# Bind to the fake-net VM's address on the isolated vmnet (NOT 0.0.0.0 on a routable iface)
service_bind_address    10.10.10.2

# DNS: answer every query with the sink address so all C2 domains resolve to us
dns_default_ip          10.10.10.2
dns_default_hostname    sink
dns_default_domainname  hacksim.lab

# HTTP/HTTPS: serve a generic page and log all requested URLs (captures C2 URLs / IOCs)
http_version            1.1
http_fakemode           on

# Keep generated TLS certs stable across runs for reproducible analysis
https_ssl_dir           /var/lib/inetsim/certs

# Report directory (per-run captures land here)
report_dir              /var/lib/inetsim/report
