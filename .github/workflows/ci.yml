name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend:
    name: Backend build & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build & test
        run: |
          chmod +x gradlew
          ./gradlew build

  frontend:
    name: Frontend build & dependency audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      - run: npm ci
      - name: Dependency audit (SCA)
        run: npm audit --audit-level=high || true   # report-only for now; tighten by dropping "|| true"
      - name: Production build
        run: npm run build
        env:
          CI: 'true'
          NODE_OPTIONS: --openssl-legacy-provider

  sast:
    name: Static analysis (Semgrep)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install semgrep
      - name: Semgrep scan
        # OWASP / language rulesets; report-only for now (remove "|| true" to gate merges)
        run: semgrep scan --config p/owasp-top-ten --config p/java --config p/javascript --config p/secrets || true

  filesystem-scan:
    name: Vulnerability scan (Trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: '0'   # report-only; set to '1' to fail on findings
